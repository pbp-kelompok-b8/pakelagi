{% firstof return_to favorites_return_to '/favorites/' as note_return %}
<div id="favorite-note-{{ favorite.pk }}" class="space-y-3" hx-history="false">
    <h3 class="label-caps !text-[10px]">Catatan pribadi</h3>
    {% if saved %}<p class="text-sm text-bottle" role="status">Catatan disimpan.</p>{% endif %}
    <p class="text-sm whitespace-pre-line break-words">{{ favorite.note|default:"Belum ada catatan." }}</p>
    <a href="{% url 'favorites:edit' favorite.pk %}?next={{ note_return|urlencode }}"
       hx-get="{% url 'favorites:edit' favorite.pk %}?next={{ note_return|urlencode }}"
       hx-target="#favorite-note-{{ favorite.pk }}" hx-swap="outerHTML" hx-push-url="false" class="btn btn-text">Edit catatan</a>
</div>
