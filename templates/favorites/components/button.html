<div id="{{ component_id }}" class="favorite-control relative z-10" data-listing-id="{{ listing.pk }}" hx-history="false">
{% if show_button %}
    {% if invite_url %}
    <a href="{{ invite_url }}" class="btn btn-secondary btn-sm bg-white" aria-label="{{ invite_label }}">
        <span aria-hidden="true">♡</span><span class="sr-only">{{ invite_label }}</span>
    </a>
    {% else %}
    {% url 'favorites:add' listing.pk as add_url %}
    {% url 'favorites:remove' listing.pk as remove_url %}
    <form method="post" action="{% if saved %}{{ remove_url }}{% else %}{{ add_url }}{% endif %}"
          hx-post="{% if saved %}{{ remove_url }}{% else %}{{ add_url }}{% endif %}"
          hx-target="#{{ component_id }}" hx-swap="outerHTML" hx-push-url="false"
          hx-sync="this:drop" hx-disabled-elt="find button" data-favorite-action
          data-add-url="{{ add_url }}" data-remove-url="{{ remove_url }}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ return_to }}">
        <input type="hidden" name="slot" value="{{ slot }}">
        <button type="submit" class="btn btn-secondary btn-sm bg-white" aria-pressed="{{ saved|yesno:'true,false' }}"
                aria-label="{% if saved %}Hapus dari favorit{% else %}Simpan ke favorit{% endif %}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="{% if saved %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
            <span class="htmx-indicator" aria-hidden="true">…</span>
        </button>
    </form>
    {% endif %}
{% endif %}
</div>
