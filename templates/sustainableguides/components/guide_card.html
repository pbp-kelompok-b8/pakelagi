<a href="{% url 'sustainableguides:detail' guide.id %}" class="flex-1 inline-flex flex-col justify-start items-start gap-3.5 overflow-hidden group cursor-pointer">
    {% if guide.image_url %}
        <img class="self-stretch h-80 w-full object-cover relative transition-transform duration-300 group-hover:scale-105" src="{{ guide.image_url }}" alt="{{ guide.title }}" />
    {% else %}
        <img class="self-stretch h-80 w-full object-cover relative transition-transform duration-300 group-hover:scale-105" src="https://placehold.co/427x320?text=Pakelagi+Jurnal" alt="Placeholder" />
    {% endif %}
    <div class="pt-1.5 flex flex-col justify-start items-start overflow-hidden">
        <div class="justify-start text-amber-700 text-xs font-semibold font-['Jost'] uppercase leading-4 tracking-wider">
            {{ guide.get_category_display }}
        </div>
    </div>
    <div class="self-stretch justify-start text-zinc-900 text-2xl font-semibold font-['Cormorant_Garamond'] leading-8 group-hover:text-amber-700 transition-colors duration-200">
        {{ guide.title }}
    </div>
    <div class="self-stretch justify-start text-stone-600 text-xs font-normal font-['Jost'] leading-5 tracking-tight line-clamp-2">
        {{ guide.ringkasan }}
    </div>
    <div class="justify-start text-stone-400 text-xs font-normal font-['Jost'] leading-5 tracking-tight mt-auto">
        {{ guide.author_name }} · {{ guide.reading_time }} menit baca · {{ guide.date_published|date:"j M Y" }}
    </div>
</a>
